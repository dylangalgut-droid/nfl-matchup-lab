name: Update NFL data and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nfl-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve most recently published source observations
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/restore_snapshot.py "$BASE_URL"
      - name: Download sources and rebuild analytics
        run: python scripts/update.py
      - name: Verify model, tracker and published snapshot
        run: |
          python -m unittest discover -s tests
          node --test tests/*.cjs
          python scripts/verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          retention-days: 1
      - name: Publish verified snapshot
        id: deploy
        uses: actions/deploy-pages@v4
